services:
  - type: web
    name: lspd-mdt
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: NEXTAUTH_URL
        value: https://lspd-mdt.onrender.com
